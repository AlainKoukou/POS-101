<!DOCTYPE html>
<html>
<head>
    <title>POS Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="page-center">
    <div class="login-card">
        <h1>POS Login</h1>

        <form action="/login" method="POST" autocomplete="off">
            <input type="text" style="display:none">
            <input type="password" style="display:none">

            <div class="form-group">
                <label>Username</label>
                <!-- Added list attribute to link with the datalist suggestions -->
                <input type="text" name="username" list="username-list" autocomplete="off" required>
                
                <!-- Datalist providing username suggestions from the database -->
                <datalist id="username-list">
                    {% for u in usernames %}
                        <option value="{{ u.username }}">
                    {% endfor %}
                </datalist>
            </div>

            <div class="form-group">
                <label>Password</label>
                <!-- Password field intentionally left without suggestions -->
                <input type="password" name="password" autocomplete="off" required>
            </div>

            <button type="submit" class="btn btn-full">Login</button>
        </form>
    </div>
</div>

</body>
</html>
